# GitLab CI/CD für BOLT (Flutter).
#
# Drei Stages, die nacheinander laufen: analyze -> test -> build.
# Scheitert eine Stage, werden die folgenden übersprungen.
# Voraussetzung: ein GitLab-Runner mit Docker-Executor.

stages:
  - analyze
  - test
  - build

# Gilt für alle Jobs (spart Wiederholung von Image + pub get).
default:
  # Offizielles cirruslabs-Image (Flutter 3.44.0 / Dart 3.12.0), passt zu ^3.12.0.
  image: ghcr.io/cirruslabs/flutter:stable
  before_script:
    - flutter --version
    - flutter pub get

# 1) Statische Code-Analyse (Lint/Fehler).
analyze:
  stage: analyze
  script:
    - flutter analyze

# 2) Unit- + Snapshot-Tests inkl. Coverage.
test:
  stage: test
  script:
    - flutter test --coverage
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
    expire_in: 1 week

# 3) App bauen – beweist, dass die App wirklich kompiliert (Debug-APK).
build:
  stage: build
  script:
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week
