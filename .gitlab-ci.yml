# GitLab CI/CD für BOLT (Flutter).
#
# Läuft bei jedem Push: statische Analyse + alle Tests (Unit + Snapshot).
# Voraussetzung: ein GitLab-Runner mit Docker-Executor (shared oder eigener).

stages:
  - test

flutter_test:
  stage: test
  # Feste Version statt :stable – muss Dart >= 3.12.2 (pubspec) erfüllen und
  # deckt sich mit dem lokalen Flutter 3.44.4, was auch Golden-Tests stabiler macht.
  image: ghcr.io/cirruslabs/flutter:3.44.4
  before_script:
    - flutter --version
    - flutter pub get
  script:
    - flutter analyze
    - flutter test --coverage
  artifacts:
    when: always
    paths:
      - coverage/lcov.info
    expire_in: 1 week
